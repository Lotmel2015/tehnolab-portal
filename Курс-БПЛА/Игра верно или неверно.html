<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Игра «Верно / Неверно» по БПЛА · Инициативная навигация (БПЛА)</title>
<script src="../tl-portal-core.js"></script><script src="../tl-bridge.js"></script>
<script>try { if (window.TLCore) TLCore.init(); if (window.TLBridge) TLBridge.init({ total: 28 }); } catch (e) { console.error(e); }</script>
<style>:root{--bg:#fff;--ink:#1B2A4A;--muted:#5A6B85;--accent:#0E7490;--accent-soft:#E6F7FA;--good:#167A4D;--good-soft:#E7F4EE;--line:#D9E2EF;--warn:#B45309;--warn-soft:#FDF1E1;--vr:#4D008C;--vr-soft:#F0EBF5}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:820px;margin:0 auto;padding:1.6rem 1.25rem 3rem}header{text-align:center;margin-bottom:1rem}.kicker{color:var(--accent);font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em}header h1{font-size:1.8rem;line-height:1.25;margin:.3rem 0 .2rem}header .sub{color:var(--muted);margin:0;font-size:1rem}.toolbar{display:flex;flex-wrap:wrap;gap:.55rem;justify-content:center;margin:1rem 0}.toolbar button{font:inherit;cursor:pointer;border-radius:10px;padding:.6rem 1.1rem;font-weight:700;font-size:.95rem;border:2px solid var(--line);background:#fff;color:var(--ink)}.toolbar button.primary{background:var(--accent);border-color:var(--accent);color:#fff}.save-note{text-align:center;font-size:.8rem;color:var(--muted);margin-bottom:1rem}#card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(20,33,61,.08);padding:2rem 1.6rem;text-align:center;min-height:180px;display:flex;flex-direction:column;justify-content:center}#card .num{color:var(--muted);font-size:.85rem;margin-bottom:.6rem}#card .text{font-size:1.35rem;font-weight:700;line-height:1.4}#card .verdict{margin-top:1rem;font-size:1rem;font-weight:700}#card.answer-good{background:var(--good-soft)}#card.answer-good .verdict{color:var(--good)}#card.answer-bad{background:var(--warn-soft)}#card.answer-bad .verdict{color:var(--warn)}.btn-row{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin-top:1rem}.btn-row button{font:inherit;cursor:pointer;border-radius:10px;padding:.6rem 1.2rem;font-weight:700;font-size:.95rem;border:2px solid var(--line);background:#fff}.btn-row button.good{border-color:var(--good);color:var(--good)}.btn-row button.bad{border-color:var(--warn);color:var(--warn)}.stats{text-align:center;margin-top:1rem;font-weight:700;color:var(--accent);font-size:1rem}footer{color:var(--muted);font-size:.8rem;border-top:1px solid var(--line);margin-top:1.4rem;padding-top:.7rem;text-align:center}</style><style>img,svg,video,canvas{max-width:100%;height:auto}pre,code,textarea{max-width:100%;overflow-x:auto;white-space:pre-wrap}table{max-width:100%}h1,h2,h3,p,li,div,span,input,select,textarea,label{overflow-wrap:break-word}body{overflow-x:hidden}@media(max-width:640px){.wrap{padding-left:14px!important;padding-right:14px!important}h1{font-size:1.4rem!important}#card .text{font-size:1.15rem!important}}</style></head>
<body><div class="wrap">
<header><p class="kicker">Инициативная навигация (БПЛА)</p><h1>Игра «Верно / Неверно» по БПЛА</h1><p class="sub">Карточки-тренажёр: правила запуска, устройство дрона и пилотирование</p></header>
<div class="toolbar no-print"><button class="primary" id="btn-next">Следующая карточка</button><button id="btn-restart">Сначала</button></div>
<div class="save-note no-print" id="save-note">Счёт хранится в этом браузере.</div>
<div id="card"><div class="num" id="card-num"></div><div class="text" id="card-text"></div><div class="verdict" id="card-verdict"></div></div>
<div class="btn-row no-print"><button class="good" id="btn-good">Верно ✓</button><button class="bad" id="btn-bad">Неверно ✗</button></div>
<div class="stats" id="stats"></div>
<footer>Инициативная навигация (БПЛА) · игровой тренажёр</footer>
</div>
<script>
(function(){var STORE="bpla-game-v1";var uid=(location.search.indexOf("uid=")>=0)?(new URLSearchParams(location.search).get("uid")||""):"";if(uid)STORE=STORE+"-u"+uid;
var cards=[{"t":"Дрон с взлётной массой от 150 г нужно регистрировать в Росавиации","good":true,"why":"Регистрация БПЛА обязательна с 150 г."},{"t":"Приложение «Небо» показывает запретные зоны для запуска","good":true,"why":"В нём видно, где можно, а где нельзя запускать дрон."},{"t":"Центр масс дрона не влияет на качество полёта","good":false,"why":"Смещённый центр масс делает полёт «кривым» — его балансируют."},{"t":"Перед проверкой моторов в Betaflight пропеллеры снимают","good":true,"why":"Иначе дрон может взлететь и поранить."},{"t":"Аккумулятор LiPo можно разряжать до нуля","good":false,"why":"Разряжение ниже 3,7 В на банку портит батарею и опасно."},{"t":"Перепутанные пропеллеры CW и CCW создают лишнюю вибрацию","good":true,"why":"Направления вращения должны чередоваться по диагонали."},{"t":"В симуляторе Liftoff можно безопасно тренироваться","good":true,"why":"Это виртуальная тренировка без риска для техники."},{"t":"Правило 180° для съёмки: выдержка ≈ 1/(2×частоты кадров)","good":true,"why":"При 30 fps выдержка около 1/60 с — естественное движение."},{"t":"В полёте на улице ветер не влияет на дрон","good":false,"why":"Ветер сносит дрон, поэтому есть ограничения по силе ветра."},{"t":"Тестер ИК-пульта показывает работу пульта через светодиод","good":true,"why":"Инфракрасный сигнал пульта вызывает мигание светодиода-индикатора."}];var order=[];for(var i=0;i<cards.length;i++)order.push(i);
function shuffle(a){for(var j=a.length-1;j>0;j--){var k=Math.floor(Math.random()*(j+1));var t=a[j];a[j]=a[k];a[k]=t;}return a;}
var st={idx:0,score:0,done:0,answered:false};try{var s=JSON.parse(localStorage.getItem(STORE)||"null");if(s)st=s;}catch(e){}
var card=document.getElementById("card"),numEl=document.getElementById("card-num"),textEl=document.getElementById("card-text"),verdictEl=document.getElementById("card-verdict"),statsEl=document.getElementById("stats");
function save(){try{localStorage.setItem(STORE,JSON.stringify(st));}catch(e){}}
function render(){if(st.idx>=order.length){card.className="";numEl.textContent="Игра пройдена!";textEl.textContent="Верно: "+st.score+" из "+st.done;verdictEl.textContent=st.done?(st.score>=st.done*0.7?"Отличный результат!":"Хорошо, попробуй ещё раз"):"";statsEl.textContent="Прогресс сохранён.";card.style.background="var(--accent-soft)";document.getElementById("btn-good").disabled=true;document.getElementById("btn-bad").disabled=true;return;}
var c=cards[order[st.idx]];card.className="";card.style.background="#fff";numEl.textContent="Карточка "+(st.idx+1)+" из "+order.length;textEl.textContent=c.t;verdictEl.textContent=st.answered?(c.good?"Верно ✓ ":"Неверно ✗ ")+c.why:"";
if(st.answered){card.classList.add(c.good?"answer-good":"answer-bad");}statsEl.textContent="Верно: "+st.score+" из "+st.done;}
render();
document.getElementById("btn-good").addEventListener("click",function(){if(st.answered||st.idx>=order.length)return;var c=cards[order[st.idx]];st.answered=true;if(c.good)st.score++;st.done++;card.classList.add(c.good?"answer-good":"answer-bad");verdictEl.textContent=(c.good?"Верно ✓ ":"Неверно ✗ ")+c.why;save();});
document.getElementById("btn-bad").addEventListener("click",function(){if(st.answered||st.idx>=order.length)return;var c=cards[order[st.idx]];st.answered=true;if(!c.good)st.score++;st.done++;card.classList.add(c.good?"answer-good":"answer-bad");verdictEl.textContent=(c.good?"Верно ✓ ":"Неверно ✗ ")+c.why;save();});
document.getElementById("btn-next").addEventListener("click",function(){if(!st.answered&&st.idx<order.length)return;st.idx++;st.answered=false;render();save();});
document.getElementById("btn-restart").addEventListener("click",function(){order=shuffle(order);st={idx:0,score:0,done:0,answered:false};card.style.background="#fff";document.getElementById("btn-good").disabled=false;document.getElementById("btn-bad").disabled=false;render();save();});
})();</script>
</body></html>
