<style> :root { --bg: #FFFFFF; --ink: #1B2A4A; --muted: #5A6B85; --accent: #1F6FE0; --accent-soft: #EAF2FD; --good: #167A4D; --good-soft: #E7F4EE; --line: #D9E2EF; --warn: #B45309; --warn-soft: #FDF1E1; --vr: #4D008C; --vr-soft: #F0EBF5;} * { box-sizing: border-box; } body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; } .wrap { max-width: 820px; margin: 0 auto; padding: 1.6rem 1.25rem 3rem; } header { text-align: center; margin-bottom: 1rem; } .kicker { color: var(--accent); font-weight: 700; font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; } header h1 { font-size: 1.8rem; line-height: 1.25; margin: .3rem 0 .2rem; } header .sub { color: var(--muted); margin: 0; font-size: 1rem; } .toolbar { display: flex; flex-wrap: wrap; gap: .55rem; justify-content: center; margin: 1rem 0; } .toolbar button { font: inherit; cursor: pointer; border-radius: 10px; padding: .6rem 1.1rem; font-weight: 700; font-size: .95rem; border: 2px solid var(--line); background: #fff; color: var(--ink); } .toolbar button.primary { background: var(--accent); border-color: var(--accent); color: #fff; } .save-note { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 1rem; } .game { background: #fff; border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 10px 30px rgba(20,33,61,.08); padding: 1.5rem 1.6rem; } .problem { background: var(--warn-soft); border-left: 4px solid var(--warn); border-radius: 0 10px 10px 0; padding: .8rem 1rem; font-size: 1.02rem; margin-bottom: 1.2rem; } .problem b { color: var(--warn); } .q-num { color: var(--muted); font-size: .85rem; margin-bottom: .4rem; } .q-text { font-weight: 700; font-size: 1.1rem; margin-bottom: 1rem; } .opt { display: block; width: 100%; text-align: left; margin: .5rem 0; padding: .8rem 1rem; cursor: pointer; border: 2px solid var(--line); border-radius: 12px; background: #fbfcfe; font: inherit; color: var(--ink); } .opt:hover { border-color: var(--accent); } .opt.ok { border-color: var(--good); background: var(--good-soft); } .opt.bad { border-color: var(--warn); background: var(--warn-soft); } .explain { margin: .8rem 0; padding: .8rem 1rem; border-radius: 12px; font-size: .95rem; display: none; } .explain.show { display: block; } .explain.ok { background: var(--good-soft); } .explain.bad { background: var(--warn-soft); } .next { display: inline-block; margin-top: .8rem; font: inherit; font-weight: 700; color: var(--accent); background: #fff; border: 2px solid var(--accent); border-radius: 10px; padding: .6rem 1.2rem; cursor: pointer; } .next:hover { background: var(--accent-soft); } .stats { text-align: center; margin-top: 1rem; color: var(--muted); font-size: .9rem; } .badges { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: center; margin: 1.4rem 0 .6rem; } .badge { font-size: .8rem; font-weight: 700; padding: .3rem .7rem; border-radius: 999px; } .b-on { background: var(--good-soft); color: var(--good); } .b-off { background: #eee; color: var(--muted); } .final { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 1.5rem 1.6rem; text-align: center; display: none; } .final.show { display: block; } .final .score-big { font-family: Georgia, serif; font-size: 2.6rem; font-weight: 700; color: var(--accent); } .final .msg { font-size: 1.1rem; margin: .6rem 0; } .final .advice { background: var(--accent-soft); border-radius: 12px; padding: .9rem 1.1rem; text-align: left; font-size: .95rem; margin-top: .9rem; } .final .advice b { color: var(--accent); } .final .restart { display: inline-block; margin-top: 1.1rem; font: inherit; font-weight: 700; color: var(--accent); background: #fff; border: 2px solid var(--accent); border-radius: 10px; padding: .6rem 1.3rem; cursor: pointer; } .final .restart:hover { background: var(--accent-soft); } footer { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 1.4rem; } @media print { .toolbar, .save-note, .no-print { display: none !important; } } /* Единый стиль · Технологическая лаборатория 2026–2027 */ :root { --shadow-card: 0 1px 2px rgba(27,42,74,.05), 0 6px 18px rgba(27,42,74,.06); --vr: #4D008C; --vr-soft: #F0EBF5;} body { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; } section { margin-top: 2.2rem; } h2 { letter-spacing: -.01em; } img { max-width: 100%; height: auto; } a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; } .card, .step-card, .tier, .link-row, .ig-card, .lesson-card, .sm, .pair, .info-box { box-shadow: var(--shadow-card); } @media (max-width: 640px) { header h1 { font-size: 1.6rem; } }

<div class="wrap"> <header> <p class="kicker">Проектный навигатор · стартовый уровень · занятие 7</p> <h1>Собери SMART-цель</h1> <p class="sub">Разминка: выбери правильное «улучшение» размытой цели и набери очки</p> </header> <div class="toolbar no-print"> <button class="primary" id="btn-restart">Начать заново</button> <button id="btn-print" type="button" onclick="window.print(); return false;">Печать / PDF</button> </div> <div class="save-note no-print" id="save-note">Счёт и прогресс сохраняются в этом браузере автоматически.</div> <div class="game"> <div class="q-num" id="q-num"></div> <div class="problem"><b>Проблема:</b> <span id="problem"></span></div> <div class="q-text" id="q-text"></div> <div id="opts"></div> <div class="explain" id="explain"></div> <button class="next no-print" id="btn-next" style="display:none">Следующий вопрос →</button> <div class="badges" id="badges"></div> </div> <div class="final" id="final"> <div class="score-big" id="final-score"></div> <div class="msg" id="final-msg"></div> <div class="advice" id="final-advice"></div> <div class="badges" id="badges2"></div> <button class="restart no-print" id="btn-restart2">Играть ещё раз</button> </div> <div class="stats no-print" id="stats"></div> <footer>Проектный навигатор · «ИИ — помощник, а не автор»</footer>
</div> <script>
(function () { var STORE = "pdn-z7-smartgame-v1"; var BADGES = [ { t: "Стартёр", need: 0 }, { t: "SMART-инженер", need: 3 }, { t: "Мастер целей", need: 5 }, { t: "Легенда навигатора", need: 7 } ]; var questions = [ { problem: "В столовой очереди, ученики не успевают поесть.", q: "Какое улучшение делает цель «сократить очередь» SMART-целью?", opts: [ { t: "Сократить среднее время ожидания в очереди с 12 до 5 минут к 1 декабря", good: true, why: "Есть число (12→5), результат и срок — всё измеримо." }, { t: "Сделать очередь лучше и быстрее", good: false, why: "«Лучше» и «быстрее» нельзя посчитать." }, { t: "Поговорить с поварами о порядке", good: false, why: "Это не цель, а одна из задач, и без срока." } ] }, { problem: "На переменах школьники сидят в телефонах, мало двигаются.", q: "Какая цель правильная?", opts: [ { t: "Создать настольную игру-конструктор и провести 3 тестовые перемены с 10 учениками к февралю", good: true, why: "Продукт + число (3, 10) + срок (февраль)." }, { t: "Сделать перемены интереснее", good: false, why: "Непонятно что, для кого и к какому сроку." }, { t: "Придумать активность для школы", good: false, why: "Слишком общо: нет результата и числа." } ] }, { problem: "Трудно повторить материал перед экзаменами.", q: "Как поставить цель по SMART для личного проекта?", opts: [ { t: "Создать тренажёр-карточки по 5 темам и пройти его 3 раза с результатом не ниже 80% к марту", good: true, why: "Числа (5 тем, 3 раза, 80%) и срок (март)." }, { t: "Хорошо подготовиться к экзаменам", good: false, why: "«Хорошо» нельзя измерить." }, { t: "Учить понемногу каждый день", good: false, why: "Это процесс, а не измеримая цель с результатом." } ] }, { problem: "В школе нет зоны для общения и отдыха.", q: "Какая цель связана с проблемой (R — relevant)?", opts: [ { t: "Создать зону отдыха в холле и протестировать её на 20 учениках к марту", good: true, why: "Напрямую решает проблему — есть связь с ней." }, { t: "Снять фильм о школьной жизни", good: false, why: "Интересно, но не связано с проблемой зоны отдыха." }, { t: "Собрать 200 рублей на новый телевизор в холл", good: false, why: "Не решает проблему общения и отдыха, просто покупка." } ] }, { problem: "Ученики забывают домашние задания.", q: "Какую цель проще всего проверить (M — measurable)?", opts: [ { t: "Создать Telegram-бота и собрать 50 подписчиков из школы к 15 ноября", good: true, why: "50 подписчиков — число, срок — дата, легко проверить." }, { t: "Помочь ученикам не забывать задания", good: false, why: "Нет числа и срока." }, { t: "Сделать удобный сервис для класса", good: false, why: "«Удобный» нельзя посчитать." } ] }, { problem: "В школе не хватает кружков по интересам.", q: "Какая цель достижима (A) за учебный год?", opts: [ { t: "Организовать один клуб настольных игр и провести 5 встреч к маю", good: true, why: "Один клуб и 5 встреч — реально за год." }, { t: "Открыть 50 новых кружков в школе за месяц", good: false, why: "Нереально за месяц — недостижимо." }, { t: "Построить новый корпус для кружков", good: false, why: "Вне возможностей школьника." } ] }, { problem: "Спортивная площадка не используется зимой.", q: "Какая цель имеет срок (T — time-bound)?", opts: [ { t: "Организовать 3 зимних физкульт-перемены на площадке к 20 декабря", good: true, why: "Есть конкретная дата — 20 декабря." }, { t: "Сделать зимнюю площадку популярной", good: false, why: "Нет даты и числа." }, { t: "Придумать зимние активности", good: false, why: "Без срока это идея, а не цель." } ] }, { problem: "Школьный сайт неудобный, трудно найти расписание.", q: "Какая цель конкретная (S — specific)?", opts: [ { t: "Создать страницу «Расписание» с поиском по 20 кружкам и собрать 30 отзывов к февралю", good: true, why: "Понятно, что именно создать, для скольких кружков и как проверить." }, { t: "Улучшить школьный сайт", good: false, why: "Непонятно, что улучшать." }, { t: "Сделать сайт современным и красивым", good: false, why: "Общие слова без результата." } ] } ]; var order = []; for (var i = 0; i < questions.length; i++) order.push(i); function shuffle(a) { for (var j = a.length - 1; j > 0; j--) { var k = Math.floor(Math.random() * (j + 1)); var t = a[j]; a[j] = a[k]; a[k] = t; } return a; } var state = { idx: 0, score: 0, done: 0, answered: false }; var qNum = document.getElementById("q-num"); var problemEl = document.getElementById("problem"); var qText = document.getElementById("q-text"); var optsBox = document.getElementById("opts"); var explainEl = document.getElementById("explain"); var nextBtn = document.getElementById("btn-next"); var statsEl = document.getElementById("stats"); var badgesEl = document.getElementById("badges"); var note = document.getElementById("save-note"); function renderBadges() { badgesEl.innerHTML = ""; BADGES.forEach(function (b) { var on = state.score >= b.need; var s = document.createElement("span"); s.className = "badge " + (on ? "b-on" : "b-off"); s.textContent = (on ? "✓ " : "☆ ") + b.t; badgesEl.appendChild(s); }); } function render() { var q = questions[order[state.idx]]; qNum.textContent = "Вопрос " + (state.idx + 1) + " из " + order.length; problemEl.textContent = q.problem; qText.textContent = q.q; optsBox.innerHTML = ""; explainEl.className = "explain"; explainEl.textContent = ""; q.opts.forEach(function (o, oi) { var b = document.createElement("button"); b.className = "opt"; b.type = "button"; b.textContent = o.t; b.addEventListener("click", function () { answer(oi); }); optsBox.appendChild(b); }); nextBtn.style.display = "none"; statsEl.textContent = "Верно: " + state.score + " из " + state.done; renderBadges(); } function answer(oi) { if (state.answered) return; var q = questions[order[state.idx]]; var o = q.opts[oi]; state.answered = true; state.done++; if (o.good) state.score++; var bs = optsBox.querySelectorAll(".opt"); bs.forEach(function (b, i2) { b.className = "opt " + (questions[order[state.idx]].opts[i2].good ? "ok" : "bad"); b.disabled = true; }); explainEl.className = "explain show " + (o.good ? "ok" : "bad"); explainEl.innerHTML = (o.good ? "✓ Верно! " : "✗ Попробуй понять, почему это не цель. ") + o.why; nextBtn.style.display = "inline-block"; statsEl.textContent = "Верно: " + state.score + " из " + state.done; renderBadges(); save(); } function showFinal() { var game = document.getElementById("game"); var final = document.getElementById("final"); game.style.display = "none"; final.style.display = ""; /* убираем инлайн, чтобы сработал CSS-класс .final.show */ final.className = "final show"; var pct = Math.round(state.score / questions.length * 100); document.getElementById("final-score").textContent = state.score + " / " + questions.length + " (" + pct + "%)"; var msg = "", advice = ""; if (state.score === questions.length) { msg = "Идеально! Ты отлично различаешь сильные и размытые цели"; advice = "Проверь теперь свою настоящую цель: найди в ней S, M, A, R, T — и запиши в «Паспорт цели». Если что-то из букв не находится — значит, цель нужно уточнить. Так же поступает твой ИИ-тьютор в DeepSeek."; } else if (state.score >= 6) { msg = "Отличный результат! Ты уверенно собираешь SMART-цели"; advice = "Ты почти эксперт. Посмотри свои ошибки: обычно они про «число и срок». Зайди в «Паспорт цели» и проверь свою цель: есть ли в ней число (M) и дата (T)? Если нет — добавь."; } else if (state.score >= 4) { msg = "Хорошо! Основы SMART ты понял(а)"; advice = "Повтори, что значит каждая буква: S — конкретно, M — измеримо, A — достижимо, R — актуально, T — срок. Перед записью своей цели проговаривай её по буковкам и спрашивай себя: «где здесь число? где срок?»."; } else { msg = "Хорошее начало! Разберёмся с SMART вместе"; advice = "Не переживай — это навык, который нарабатывается. Правило-шпаргалка: хорошая цель = результат + число + срок + связь с проблемой. Открой игру ещё раз и читай объяснение под каждым ответом — там вся суть."; } document.getElementById("final-msg").textContent = msg; document.getElementById("final-advice").innerHTML = "<b>Обратная связь:</b> " + advice; var b2 = document.getElementById("badges2"); b2.innerHTML = ""; BADGES.forEach(function (b) { var on = state.score >= b.need; var s = document.createElement("span"); s.className = "badge " + (on ? "b-on" : "b-off"); s.textContent = (on ? "✓ " : "☆ ") + b.t; b2.appendChild(s); }); statsEl.textContent = ""; } function next() { state.idx++; state.answered = false; if (state.idx >= order.length) { showFinal(); save(); return; } render(); save(); } function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} } function restart() { /* Полный сброс: новый порядок вопросов, нулевой счёт */ shuffle(order); state = { idx: 0, score: 0, done: 0, answered: false }; document.getElementById("final").style.display = "none"; document.getElementById("final").className = "final"; document.getElementById("game").style.display = "block"; /* Гарантированно сбрасываем поля ввода к начальному виду */  optsBox.innerHTML = ""; explainEl.className = "explain"; explainEl.textContent = ""; nextBtn.style.display = "none"; nextBtn.disabled = false; note.textContent = "Счёт и прогресс сохраняются автоматически. Удачи!"; render(); save(); } nextBtn.addEventListener("click", next); document.getElementById("btn-restart").addEventListener("click", restart); document.getElementById("btn-restart2").addEventListener("click", restart); /* Восстанавливаем состояние: вопрос начинается с неотвеченного */ var restored = false; try { var s = JSON.parse(localStorage.getItem(STORE)); if (s && s.idx !== undefined && s.idx >= 0 && s.idx < questions.length) { state = s; state.answered = false; /* разрешаем клик по кнопкам */  restored = true; } } catch (e) {} if (!restored) { shuffle(order); state = { idx: 0, score: 0, done: 0, answered: false }; } render(); save();
})();
</script>
