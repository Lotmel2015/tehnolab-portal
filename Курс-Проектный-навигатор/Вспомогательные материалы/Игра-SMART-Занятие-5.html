<style> :root { --bg: #FFFFFF; --ink: #1B2A4A; --muted: #5A6B85; --accent: #1F6FE0; --accent-soft: #EAF2FD; --good: #167A4D; --good-soft: #E7F4EE; --line: #D9E2EF; --warn: #B45309; --warn-soft: #FDF1E1; --vr: #4D008C; --vr-soft: #F0EBF5;} * { box-sizing: border-box; } body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; } .wrap { max-width: 820px; margin: 0 auto; padding: 1.6rem 1.25rem 3rem; } header { text-align: center; margin-bottom: 1rem; } .kicker { color: var(--accent); font-weight: 700; font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; } header h1 { font-size: 1.8rem; line-height: 1.25; margin: .3rem 0 .2rem; } header .sub { color: var(--muted); margin: 0; font-size: 1rem; } .toolbar { display: flex; flex-wrap: wrap; gap: .55rem; justify-content: center; margin: 1rem 0; } .toolbar button { font: inherit; cursor: pointer; border-radius: 10px; padding: .6rem 1.1rem; font-weight: 700; font-size: .95rem; border: 2px solid var(--line); background: #fff; color: var(--ink); } .toolbar button.primary { background: var(--accent); border-color: var(--accent); color: #fff; } .save-note { text-align: center; font-size: .8rem; color: var(--muted); margin-bottom: 1rem; } #card { background: #fff; border: 1px solid var(--line); border-radius: 18px; box-shadow: 0 10px 30px rgba(20,33,61,.08); padding: 2rem 1.6rem; text-align: center; min-height: 200px; display: flex; flex-direction: column; justify-content: center; } #card .num { color: var(--muted); font-size: .85rem; margin-bottom: .6rem; } #card .text { font-size: 1.35rem; font-weight: 700; color: var(--ink); line-height: 1.4; } #card .verdict { margin-top: 1rem; font-size: 1rem; font-weight: 700; } #card.answer-good { background: var(--good-soft); } #card.answer-good .verdict { color: var(--good); } #card.answer-bad { background: var(--warn-soft); } #card.answer-bad .verdict { color: var(--warn); } .btn-row { display: flex; flex-wrap: wrap; gap: .6rem; justify-content: center; margin-top: 1.2rem; } .btn-row button { font: inherit; cursor: pointer; border-radius: 10px; padding: .65rem 1.3rem; font-weight: 700; font-size: 1rem; border: 2px solid var(--line); background: #fff; color: var(--ink); } .btn-row button.good { border-color: var(--good); color: var(--good); } .btn-row button.good:hover { background: var(--good-soft); } .btn-row button.bad { border-color: var(--warn); color: var(--warn); } .btn-row button.bad:hover { background: var(--warn-soft); } .stats { text-align: center; margin-top: 1rem; color: var(--muted); font-size: .9rem; } footer { text-align: center; color: var(--muted); font-size: .8rem; margin-top: 1.4rem; } @media print { .toolbar, .save-note, .btn-row, .stats { display: none !important; } } /* Единый стиль · Технологическая лаборатория 2026–2027 */ :root { --shadow-card: 0 1px 2px rgba(27,42,74,.05), 0 6px 18px rgba(27,42,74,.06); --vr: #4D008C; --vr-soft: #F0EBF5;} body { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; } section { margin-top: 2.2rem; } h2 { letter-spacing: -.01em; } img { max-width: 100%; height: auto; } a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; } .card, .step-card, .tier, .link-row, .ig-card, .lesson-card, .sm, .pair, .info-box { box-shadow: var(--shadow-card); } @media (max-width: 640px) { header h1 { font-size: 1.6rem; } }

<div class="wrap"> <header> <p class="kicker">Проектный навигатор · стартовый уровень · занятие 5</p> <h1>Игра «SMART / не SMART»</h1> <p class="sub">Карточки-тренажёр: определи, какая цель сильная, а какая — размытая</p> </header> <div class="toolbar no-print"> <button class="primary" id="btn-next">Следующая карточка</button> <button id="btn-restart">Сначала</button> </div> <div class="save-note no-print" id="save-note">Счёт хранится в этом браузере.</div> <div id="card"> <div class="num" id="card-num"></div> <div class="text" id="card-text"></div> <div class="verdict" id="card-verdict"></div> </div> <div class="btn-row no-print"> <button class="good" id="btn-good">Это SMART-цель ✓</button> <button class="bad" id="btn-bad">Это НЕ SMART-цель ✗</button> </div> <div class="stats" id="stats"></div> <footer>Проектный навигатор · «ИИ — помощник, а не автор»</footer>
</div> <script>
(function () { var STORE = "pdn-z5-game-v1"; var cards = [ { t: "Создать приложение", good: false, why: "Нет числа, пользователя и срока." }, { t: "Разработать прототип Telegram-бота для школы к 15 декабря", good: true, why: "Конкретно, измеримо, есть срок." }, { t: "Улучшить перемены", good: false, why: "Размыто: непонятно что, для кого и к какому сроку." }, { t: "Создать настольную игру и протестировать её на 10 учениках к февралю", good: true, why: "Продукт, число, срок и пользователи." }, { t: "Помочь пожилым", good: false, why: "Нет результата, числа и срока." }, { t: "Провести 3 мастер-класса по смартфону для пожилых в марте", good: true, why: "Конкретное действие, число 3, месяц." }, { t: "Сделать красиво", good: false, why: "«Красиво» нельзя посчитать." }, { t: "Создать сайт с расписанием кружков и собрать на нём 100 просмотров за месяц", good: true, why: "Продукт, число 100, срок — месяц." }, { t: "Изучить тему", good: false, why: "Непонятно, что именно и зачем." }, { t: "Провести опрос 30 учеников о столовой к 15 октября", good: true, why: "Конкретно: 30 человек, тема, срок." } ]; var order = []; for (var i = 0; i < cards.length; i++) order.push(i); function shuffle(a) { for (var j = a.length - 1; j > 0; j--) { var k = Math.floor(Math.random() * (j + 1)); var t = a[j]; a[j] = a[k]; a[k] = t; } return a; } var state = { idx: 0, score: 0, done: 0, answered: false }; var card = document.getElementById("card"); var numEl = document.getElementById("card-num"); var textEl = document.getElementById("card-text"); var verdictEl = document.getElementById("card-verdict"); var statsEl = document.getElementById("stats"); function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {} } function render() { var c = cards[order[state.idx]]; numEl.textContent = "Карточка " + (state.idx + 1) + " из " + order.length; textEl.textContent = c.t; verdictEl.textContent = state.answered ? (c.good ? "Это SMART-цель ✓ " : "Это НЕ SMART-цель ✗ ") + c.why : ""; card.className = state.answered ? (c.good ? "answer-good" : "answer-bad") : ""; statsEl.textContent = "Верно: " + state.score + " из " + state.done; } function answer(goodGuess) { if (state.answered) return; var c = cards[order[state.idx]]; state.answered = true; state.done++; if (goodGuess === c.good) state.score++; render(); save(); } function next() { state.idx++; state.answered = false; if (state.idx >= order.length) { shuffle(order); state.idx = 0; } render(); save(); } function restart() { shuffle(order); state.idx = 0; state.score = 0; state.done = 0; state.answered = false; render(); save(); } document.getElementById("btn-good").addEventListener("click", function () { answer(true); }); document.getElementById("btn-bad").addEventListener("click", function () { answer(false); }); document.getElementById("btn-next").addEventListener("click", next); document.getElementById("btn-restart").addEventListener("click", restart); try { var s = JSON.parse(localStorage.getItem(STORE)); if (s) state = s; } catch (e) {} if (!state || state.idx === undefined) { shuffle(order); state = { idx: 0, score: 0, done: 0, answered: false }; } render();
})();
</script>
